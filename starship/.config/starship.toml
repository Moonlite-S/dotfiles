#Location: ~/.config/starship.toml
#What_is_starship: https://starship.rs/

add_newline = true
command_timeout = 2000

format = """$env_var$os$username$hostname$kubernetes$directory$git_branch$git_status$python
$character
"""

[character]
success_symbol = "[╰─](#ff8fa3)"
error_symbol = "[╰─](bold red)"

[env_var]
symbol = "╭╴"
variable = 'SHELL'
style = "#ff8fa3"
format = "[$symbol]($style)"
disabled = false

# ---

[os]
style = "#ff8fa3 bold"
format = '[$symbol]($style) '   
disabled = false

[os.symbols]
Windows = ' '
Arch = '󰣇'
Ubuntu = ''
Macos = '󰀵'
Unknown = '󰠥'

# ---

# Shows the username
[username]
style_user = '#ffb7b2 bold'
style_root = '#ff8fa3 bold'
format = '[//](#908caa bold) [$user]($style) ' 
disabled = false
show_always = true

# Shows the hostname
[hostname]
ssh_only = false
style = '#89dceb bold'
format = '[//](#908caa bold) [$hostname]($style) '
disabled = false

# Shows current directory
[directory]
truncation_length = 0
truncation_symbol = '…/'
home_symbol = '~'
read_only = '  '
style = '#e0def4 bold'
format = '[//](#908caa bold) [$path]($style)[$read_only]($read_only_style) '


# Shows current git branch
[git_branch]
symbol = ' '
style = '#89dceb bold'
format = '[//](#908caa bold) [$symbol\[$branch\]]($style) '

# Shows current git status
[git_status]
disabled = true
format = '[ $all_status $ahead_behind]($style) '
style = '#ff8fa3 bold'
conflicted = '🏳'
up_to_date = ''
untracked = ' '
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
stashed = ' '
modified = ' '
staged = '[++\($count\)](green)'
renamed = '襁 '
deleted = ' '

# Shows kubernetes context and namespace
[kubernetes]
style = '#e2c3c6 bold'
format = 'via [󱃾 $context\($namespace\)]($style) '
disabled = false

# ---

[vagrant]
disabled = true

[docker_context]
disabled = true

[helm]
disabled = true

[python]
symbol = '󰌠'
python_binary = ['./venv/bin/python', 'python', 'python3', 'python2']
style = '#ffb7b2 bold'
format = '[//](#908caa bold) [${symbol} ${pyenv_prefix}(${version} )(\($virtualenv\) )]($style) '

[nodejs]
disabled = true

[ruby]
disabled = true

[terraform]
disabled = true
