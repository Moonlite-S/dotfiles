##########################################################################

# themes
include ./theme.conf
#include Wryan.conf
#include VSCode_Dark.conf

# terminal opacity and blur
background_opacity 0.8
background_blur 60

# advance 
term xterm-kitty

# terminal bell
enable_audio_bell no

# os specific tweaks (Gnome window decoration for wayland)
linux_display_server x11

# font
font_family        FiraCode Nerd Font Mono
# font_family        Source Code Pro for Powerline
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size 12.0

# font size management 
map ctrl+shift+backspace change_font_size all 0

# cursor customization
# block / beam / underline
cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_start_threshold 1
cursor_stop_blinking_after 0
shell_integration no-cursor

# scrollback
scrollback_lines 5000
wheel_scroll_multiplier 3.0

# mouse
mouse_hide_wait -1

# window layout
remember_window_size yes
initial_window_width  1300
initial_window_height 750
window_border_width 0.1pt
enabled_layouts tall
window_padding_width 5
window_margin_width 0
hide_window_decorations titlebar-only
draw_minimal_borders no
placement_strategy center

# Map Option + h/j/k/l to Arrow Keys in Kitty
map alt+h send_text all \x1b[D
map alt+j send_text all \x1b[B
map alt+k send_text all \x1b[A
map alt+l send_text all \x1b[C

# Uses alt key
macos_option_as_alt left

# layout management
# map ctrl+shift+G next_layout
# map ctrl+alt+r goto_layout tall
# map ctrl+alt+s goto_layout stack

# tab bar customization
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
tab_bar_align left
active_tab_font_style   bold
inactive_tab_font_style normal

map alt+backspace send_text all \x17

# tab management
# map ctrl+shift+t new_tab
# map ctrl+shift+F next_tab
# map ctrl+shift+D previous_tab
# map ctrl+shift+q close_tab

