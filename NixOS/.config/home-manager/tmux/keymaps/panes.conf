# Delete Panes without confirmation
bind -r M-x kill-pane

# Splitting Windows
bind -r 'h' split-window -v -c "#{pane_current_path}"
bind -r 'v' split-window -h -c "#{pane_current_path}"

# Swapping panes
bind -n M-H swap-pane -d -t '{left-of}'
bind -n M-J swap-pane -d -t '{down-of}'
bind -n M-K swap-pane -d -t '{up-of}'
bind -n M-L swap-pane -d -t '{right-of}'

# Resizing panes (lowercase mirror of the swap keys above)
bind -n M-h resize-pane -L 3
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 3
