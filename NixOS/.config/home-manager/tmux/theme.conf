# Noctalia dynamic theme: loads the @noctalia_* palette options that
# tmux-powerline's themes/noctalia.sh reads live on every status refresh.
# Regenerated by Noctalia on theme/wallpaper change; -q avoids an error
# before the first generation.
source-file -q ~/.config/tmux/themes/noctalia.conf

# Lets programs in a pane (yazi's image previews, ghostty's Kitty
# graphics protocol) bypass tmux with a raw escape sequence instead of
# it being swallowed - off by default in tmux, which is why yazi's
# previews render as blank/broken inside a tmux pane otherwise. "on"
# (not "all") only allows this while the pane is visible, which is
# always true for a preview you're actively looking at.
set -g allow-passthrough on

# Amount of time to press any keybinds with the -r flas before you have to press <leader> again
# So you only have a second to press the keybind
set -g repeat-time 1000

# Auto rename
set -g renumber-windows on
