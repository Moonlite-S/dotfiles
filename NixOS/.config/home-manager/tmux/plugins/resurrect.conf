# tmux-resurrect: capture full pane scrollback content on save (not
# just cwd/command), so restored panes aren't blank. Ported from the
# pre-home-manager tmux.conf.bu backup (dropped in the 2026-09-21 TPM
# migration, never re-added).
set -g @resurrect-capture-pane-contents 'on'

# Also restore these specific long-running foreground processes
# (rather than just their cwd) when found running in a captured pane.
set -g @resurrect-processes 'btop opencode claude lazygit'

# Deliberately NOT setting @resurrect-strategy-nvim here. Its value is
# a *local* filename resurrect will run `nvim -S <value>` against in
# each pane's cwd (vim's own -S session-file convention) - it doesn't
# know about mini.sessions' single global session directory
# (~/.local/share/nvim/session/), so setting it would just make
# resurrect try to open a nonexistent ./<value> file in every restored
# nvim pane and fail. Left at resurrect's default_strategy, a restored
# pane that was running nvim just relaunches bare `nvim` (landing on
# the dashboard) - restoring the actual buffer/window layout inside
# nvim stays a separate, manual step via <leader>Sl or the dashboard's
# session picker (nvim/keymaps/sessions.lua, nvim/plugins/snacks.lua),
# already working, not touched by this change.
