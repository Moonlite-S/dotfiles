palette = "noctalia"

add_newline = true
command_timeout = 2000

format = """$directory$git_branch$git_status$python$nodejs
$character
"""

[character]
success_symbol = "[](green)"
error_symbol = "[X](bold red)"

# Shows current directory
[directory]
truncation_length = 0
truncation_symbol = '…/'
home_symbol = '~'
read_only = '  '
style = 'white bold'
format = '(#908caa bold) [$path]($style)[$read_only]($read_only_style) '

# Shows current git branch
[git_branch]
symbol = ' '
style = 'red bold'
format = '[//](#908caa bold) [$symbol\[$branch\]]($style) '

# Shows current git status
[git_status]
disabled = true
format = '[ $all_status $ahead_behind]($style) '
style = 'red bold'
conflicted = '🏳'
up_to_date = ''
untracked = ' '
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
stashed = ' '
modified = ' '
staged = '[++\($count\)](green)'
renamed = '襁 '
deleted = ' '

[python]
symbol = '󰌠'
python_binary = ['./venv/bin/python', 'python', 'python3', 'python2']
style = '#green bold'
format = '[//](#908caa bold) [${symbol} ${pyenv_prefix}(${version} )(\($virtualenv\) )]($style) '

[nodejs]
symbol = '󰎙'
style = '#magenta bold'
format = '[//](#908caa bold) [${symbol} (${version} )]($style) '
disabled = false

[ruby]
disabled = true

[terraform]
disabled = true

